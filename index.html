<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情境因素对智能体面孔情绪信息加工的影响</title>
    <script src="https://unpkg.com/jspsych@latest"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@latest"></script>
    <link href="https://unpkg.com/jspsych@latest/css/jspsych.css" rel="stylesheet" type="text/css">
<style>
  body { background:#EDEDED; }
  .jspsych-content { max-width: 900px !important; }
  .stage { font-family:Microsoft YaHei,SimHei,sans-serif; color:#000000; }
  .fixation { font-size:36px; font-weight:bold; }
  .context-text { font-size:24px; line-height:1.9; text-align:center; max-width:820px; margin:0 auto; }
  .instructions { font-size:22px; line-height:2.0; text-align:left; max-width:760px; margin:0 auto; }
  .instructions h2 { text-align:center; }
  .key { display:inline-block; border:2px solid #333; border-radius:5px; padding:1px 9px; margin:0 4px; font-weight:bold; background:#fff; }
  
</style>
</head>
<body></body>
<script>
/* 0. 取插件全局（兼容 v7 注入名，避免 undefined 白屏） */
const HTMLKB = 'jsPsychHtmlKeyboardResponse';

/* 1. 先初始化 jsPsych（必须在用到 jsPsych.xxx 之前） */
const jsPsych = initJsPsych({
  on_finish: function () {
    const csv = jsPsych.data.get().csv();
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'all_data.csv'; a.click();
    URL.revokeObjectURL(url);
    document.body.innerHTML = "<h1 style='display:flex;align-items:center;justify-content:center'>实验结束，感谢您的参与！</h1>";
  }
});

/* 2. 刺激数据：2 效价 x 2 唤醒度 x 3 段 = 12 段正式文本 */
const scenarios = [
  { id:'S1',  valence:'high', arousal:'high', text:'终场哨声响起，你所在的球队在最后一秒绝杀对手，赢得了总决赛的冠军。队友们疯狂地冲向你，将你高高抛起，全场观众的欢呼声震耳欲聋。肾上腺素在体内奔涌，你感到心脏狂跳，热血沸腾，整个世界都在为你喝彩。' },
  { id:'S2',  valence:'high', arousal:'high', text:'你随手买的一张彩票，竟在开奖时与所有号码吻合。你猛地从沙发上弹起来，难以置信地瞪大眼睛。反复核对确认无误后，一股狂喜从脚底直冲头顶，你忍不住放声大喊，双手止不住地颤抖，整个人被巨大的幸运感和兴奋感彻底吞没。' },
  { id:'S3',  valence:'high', arousal:'high', text:'经过数月艰苦卓绝的训练，你终于站在了悬崖峭壁之巅，成功登顶了那座一直想征服的险峰。俯瞰脚下翻腾的云海，强烈的成就感和征服的快感让你忍不住放声长啸。风声呼啸，心跳如鼓，你感受到了生命最极致的澎湃与自由。' },
  { id:'S4',  valence:'high', arousal:'low',  text:'一个慵懒的周末下午，阳光透过白色的纱帘洒在木质地板上，形成斑驳的光影。你窝在柔软的沙发里，手里捧着一本喜欢的书，旁边放着一杯冒着热气的清茶。房间里弥漫着浓浓的面包香，时间仿佛都慢了下来，内心充满了安稳与满足。' },
  { id:'S5',  valence:'high', arousal:'low',  text:'你和一位相识多年的老朋友坐在河边的长椅上，看着夕阳缓缓沉入地平线。你们随意聊着过去那些平淡却有趣的琐事。晚风轻柔地吹过，带来青草的香气，这种无需多言的默契和陪伴，让你感到无比舒适和惬意。' },
  { id:'S6',  valence:'high', arousal:'low',  text:'你独自走在乡间的小路上，两旁是一望无际的金色麦田，微风拂过，掀起层层麦浪。远处的村庄升起炊烟，偶尔传来几声犬吠。你深吸了一口气，空气中满是泥土和庄稼的芬芳。这份远离喧嚣的宁静与和谐，让你的内心感到前所未有的平静与富足。' },
  { id:'S7',  valence:'low',  arousal:'high', text:'十字路口，一辆失控的大货车正对着你的车高速冲来。刺耳的刹车声和尖锐的喇叭声瞬间撕裂空气，你瞳孔骤缩，大脑一片空白。恐惧像冰水一样瞬间浸湿全身，你死死抓住方向盘，每一块肌肉都因极度紧张而僵硬，心脏几乎要从喉咙里跳出来。' },
  { id:'S8',  valence:'low',  arousal:'high', text:'飞机突遇强气流，机身剧烈颠簸甚至倾斜，行李架砰砰作响，氧气面罩在你面前晃动脱落。广播里传来机长急促的声音，要求所有人系好安全带。你死死贴住椅背，每一次剧烈的下坠都让胃部痉挛。周围乘客的尖叫声此起彼伏，你满脑子都是最坏的画面，眼前阵阵发黑，心脏狂跳不止。' },
  { id:'S9',  valence:'low',  arousal:'high', text:'深夜加班后，你走在回家的巷子里，忽然听到身后传来一阵急促且沉重的脚步声。你加快步伐，身后的脚步声也随之加速。你猛地回头，看到一个戴着帽子的黑影正快速向你逼近。惊恐瞬间攫住了你的呼吸，你浑身汗毛倒竖，肾上腺素飙升，脑子里的声音骤然尖叫快跑。' },
  { id:'S10', valence:'low',  arousal:'low',  text:'窗外的雨已经淅淅沥沥地下了一整天，天空灰蒙蒙的，看不到一丝光亮。你躺在床上，感觉身体沉重得像灌了铅，不想做任何事。复习计划被搁置在一旁，手机里的消息也懒得回。一种空落落的、说不上来的疲惫感笼罩着你，只觉得一切似乎都索然无味。' },
  { id:'S11', valence:'low',  arousal:'low',  text:'你又一次收到了面试未通过的邮件。这已经是这个月第三次了。你没有像第一次那样愤怒或不甘，只是默默关掉邮件，靠在椅背上。你望着天花板，心里泛起一阵酸涩的无力感，对未来感到迷茫，不知道下一步该怎么走。' },
  { id:'S12', valence:'low',  arousal:'low',  text:'因为一个误会，最好的朋友对你说了很多伤人的话。你想解释，却发现嗓子像是被堵住了，一个字都说不出来。争吵过后，你一个人坐在空荡荡的房间里，连灯都没有开。不被理解的委屈和深深的失望，像潮水一样慢慢淹没你，让你连哭的力气都没有，只剩下一片麻木。' },
];
const practiceTexts = [
  '练习一：终场哨声响起，你所在的球队在最后一秒绝杀对手，赢得了总决赛的冠军。队友们疯狂地冲向你，将你高高抛起，全场观众的欢呼声震耳欲聋。肾上腺素在体内奔涌，你感到心脏狂跳，热血沸腾，整个世界都在为你喝彩。',
  '练习二：一个慵懒的周末下午，阳光透过白色的纱帘洒在木质地板上，形成斑驳的光影。你窝在柔软的沙发里，手里捧着一本喜欢的书，旁边放着一杯冒着热气的清茶。房间里弥漫着浓浓的面包香，时间仿佛都慢了下来，内心充满了安稳与满足。',
  '练习三：十字路口，一辆失控的大货车正对着你的车高速冲来。刺耳的刹车声和尖锐的喇叭声瞬间撕裂空气，你瞳孔骤缩，大脑一片空白。恐惧像冰水一样瞬间浸湿全身，你死死抓住方向盘，每一块肌肉都因极度紧张而僵硬，心脏几乎要从喉咙里跳出来。',
  '练习四：窗外的雨已经淅淅沥沥地下了一整天，天空灰蒙蒙的，看不到一丝光亮。你躺在床上，感觉身体沉重得像灌了铅，不想做任何事。复习计划被搁置在一旁，手机里的消息也懒得回。一种空落落的、说不上来的疲惫感笼罩着你，只觉得一切似乎都索然无味。'
];

const FACE_MODE = 'file';
const FACE_FILES = { positive:'https://a.imgckr.com/2026/10/25/jBQJq.png', neutral:'https://a.imgckr.com/2026/10/25/jBSzE.png', negative:'https://a.imgckr.com/2026/10/25/jBk5u.png' };
function faceStimulus(emotion){
  if (FACE_MODE === 'file') {
    return '<img src="' + FACE_FILES[emotion] + '" style="width:280px;height:280px;">';
  }
  const mouth = { positive:'M30,72 Q50,95 70,72', neutral:'M30,80 L70,80', negative:'M30,90 Q50,70 70,90' }[emotion];
  const brow  = { positive:'M30,42 Q38,34 46,42 M54,42 Q62,34 70,42',
                  neutral:'M30,40 L46,40 M54,40 L70,40',
                  negative:'M30,44 L46,38 M54,38 L70,44' }[emotion];
  const color = { positive:'#1B7837', neutral:'#666666', negative:'#C0392B' }[emotion];
  return '<svg width="280" height="280" viewBox="0 0 100 120">'
       + '<circle cx="50" cy="60" r="42" fill="#FFF" stroke="' + color + '" stroke-width="3"/>'
       + '<path d="' + brow + '" stroke="' + color + '" stroke-width="3" fill="none"/>'
       + '<circle cx="38" cy="50" r="3" fill="' + color + '"/><circle cx="62" cy="50" r="3" fill="' + color + '"/>'
       + '<path d="' + mouth + '" stroke="' + color + '" stroke-width="4" fill="none"/></svg>';
}

const KEYS = ['f','j','k'];
const KEY2EMO = { f:'positive', j:'neutral', k:'negative' };
const EMO2CN = { positive:'积极', neutral:'中性', negative:'消极' };
const PROMPT = '<div class="stage" style="font-size:18px;color:#888">F(积极) / J(中性) / K(消极)</div>';

/* 3. 指导语 */
const instructions = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '<div class="stage instructions"><h2>实验说明</h2>'
    + '<p>欢迎参加本次实验。实验分为<b>练习阶段</b>与<b>正式实验阶段</b>。</p>'
    + '<p>每个试次中，屏幕上会先呈现一段<b>情境文本</b>，请您仔细阅读，随后呈现一张<b>智能体面孔图片</b>。'
    + '请判断该面孔所表达的情绪，并按下列键进行反应：</p>'
    + '<p>积极表情按 <span class="key">F</span>&nbsp;&nbsp;中性表情按 <span class="key">J</span>&nbsp;&nbsp;消极表情按 <span class="key">K</span></p>'
    + '以下为三张面孔的示例图，从左到右依次为<b>积极、中性、消极</b>'
    + '<div style="display:flex;justify-content:center;gap:40px;margin:20px 0;">'
    +   '<img src="https://a.imgckr.com/2026/10/25/jBQJq.png" style="width:200px;height:200px;">'
    +   '<img src="https://a.imgckr.com/2026/10/25/jBSzE.png"  style="width:200px;height:200px;">'
    +   '<img src="https://a.imgckr.com/2026/10/25/jBk5u.png" style="width:200px;height:200px;">'
    + '</div>'
    + '<p>请快速进行反应，准备好后按空格键开始。</p></div>',
  choices: [" "],
  data: { phase: 'instruction' }
};

/* 4. 面孔试次：面孔呈现 800ms 期间按键即中断记录；
       随后 1000ms 空屏(ITI)作为延迟反应窗，面孔内未按键时仍可补按。 */
function faceAndITIs(scn, emotion, phase, compMeta){
  const meta = Object.assign({ phase:phase, scenario_id:scn.id, valence:scn.valence, arousal:scn.arousal, face_emotion:emotion }, compMeta||{});
  return [
    { type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage fixation">+</div>', choices:'NO_KEYS', trial_duration:500, data:Object.assign({comp:'fixation'},meta) },
    { type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage context-text">'+scn.text+'</div>', choices:'NO_KEYS', trial_duration:8000, data:Object.assign({comp:'context'},meta) },
    { type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage fixation">+</div>', choices:'NO_KEYS', trial_duration:500, data:Object.assign({comp:'fixation'},meta) },
    { type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage">'+faceStimulus(emotion)+'</div>', choices:KEYS, trial_duration:1000,
      data:Object.assign({comp:'face', correct_face:emotion},meta) },
    { type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage"></div>', choices:KEYS, trial_duration:1000, 
      data:Object.assign({comp:'iti_late'},meta) }
  ];
}
/* 文本-面孔分配：每个水平内 3 段文本随机对应 正/中/负 三种面孔各一次，
   整段呈现顺序再随机化。这样每段文本只判断 1 张面孔，正式试次 = 4水平 x 3 = 12。*/
function assignFacesByLevel(){
  const levels = ['high-high','high-low','low-high','low-low'];
  const pairs = [];
  levels.forEach(lv => {
    const texts = jsPsych.randomization.shuffle(scenarios.filter(s => (s.valence+'-'+s.arousal)===lv));
    const faces = jsPsych.randomization.shuffle(['positive','neutral','negative']);
    texts.forEach((scn,i) => { pairs.push({ scn:scn, face:faces[i] }); });
  });
  return jsPsych.randomization.shuffle(pairs);
}


/* 6. 练习阶段：3 试次（仅熟悉任务流程，不提供反馈） */
function buildPracticeBlock(){
  const tl = [];
  const practiceFaces = ['positive','neutral','negative','neutral'];
  practiceTexts.forEach((txt, i) => {
    const target = practiceFaces[i];
    const meta = { phase:'practice', idx:i, face_emotion:target };
    tl.push({ type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage fixation">+</div>', choices:'NO_KEYS', trial_duration:500, data:Object.assign({comp:'fixation'},meta) });
    tl.push({ type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage context-text">'+txt+'</div>', choices:'NO_KEYS', trial_duration:8000, data:Object.assign({comp:'context'},meta) });
    tl.push({ type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage fixation">+</div>', choices:'NO_KEYS', trial_duration:500, data:Object.assign({comp:'fixation'},meta) });
    tl.push({ type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage">'+faceStimulus(target)+'</div>', choices:KEYS, trial_duration:1000,
      data:Object.assign({comp:'face', correct_face:target},meta) });
    // 替换 feedback 试次为 ITI 间隔（不再显示任何反馈）
    tl.push({ type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage"></div>', choices:'NO_KEYS', trial_duration:1000,
      data:Object.assign({comp:'iti'},meta) });
  });
  // 门控代码已删除，练习固定3次后直接进入正式实验
  return tl;
}

/* 7. 完整 timeline */
let timeline = [instructions];
timeline = timeline.concat(buildPracticeBlock());
timeline.push({ type:jsPsychHtmlKeyboardResponse, stimulus:'<div class="stage instructions"><p>练习结束，正式实验即将开始，请继续保持又快又准确的反应。若您已经休息完毕，请按空格键继续。</p></div>', choices:[' '], data:{phase:'instruction2'} });
assignFacesByLevel().forEach(t => { timeline = timeline.concat(faceAndITIs(t.scn, t.face, 'formal', {})); });

/* 8. 启动实验（关键：必须调用 run） */
jsPsych.run(timeline);
</script>
